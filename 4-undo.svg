<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" role="img" aria-label="Every fault change is an open obligation until undone; one still open at the end is undone by the runner and the run is ERROR" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs><rect width="880" height="200" fill="#ffffff"/><rect x="20" y="70" width="150" height="56" rx="10" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/><text x="95.0" y="95.0" font-size="14" fill="#7d4e00" font-weight="600" text-anchor="middle">Fault changes</text><text x="95.0" y="114.0" font-size="12" fill="#59636e" font-weight="400" text-anchor="middle">pause, rule, mount…</text><rect x="220" y="70" width="150" height="56" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="295.0" y="95.0" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">Obligation open</text><text x="295.0" y="114.0" font-size="12" fill="#59636e" font-weight="400" text-anchor="middle">recorded in a ledger</text><rect x="530" y="20" width="150" height="56" rx="10" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.5"/><text x="605.0" y="45.0" font-size="14" fill="#116329" font-weight="600" text-anchor="middle">Closed</text><text x="605.0" y="64.0" font-size="12" fill="#59636e" font-weight="400" text-anchor="middle">undone at teardown</text><rect x="530" y="120" width="150" height="56" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="605.0" y="145.0" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">Runner undoes it</text><text x="605.0" y="164.0" font-size="12" fill="#59636e" font-weight="400" text-anchor="middle">anyway, at the end</text><rect x="710" y="120" width="150" height="56" rx="10" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/><text x="785.0" y="145.0" font-size="14" fill="#7d4e00" font-weight="600" text-anchor="middle">Run is ERROR</text><text x="785.0" y="164.0" font-size="12" fill="#59636e" font-weight="400" text-anchor="middle">plan not followed</text><path d="M172,98 L218,98" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><path d="M372,90 L400,90 L400,48 L528,48" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><text x="464.0" y="41.0" font-size="12" fill="#59636e" font-weight="400" text-anchor="middle">undone by its fault</text><path d="M372,106 L400,106 L400,148 L528,148" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><text x="464.0" y="141.0" font-size="12" fill="#59636e" font-weight="400" text-anchor="middle">still open at the end</text><path d="M682,148 L708,148" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/></svg>