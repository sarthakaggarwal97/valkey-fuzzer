# Start and stop a standalone primary with replicas: the deployment smoke test, which judges no experiment.
#
#   valkey-fuzzer run examples/standalone_replicas_scenario.yaml \
#     --experiment-dir examples/experiments
scenario_id: standalone-replicas-deployment-smoke
seed: 202

experiment:
  id: example.deployment-smoke
  inputs: {}

deployment:
  mode: standalone
  replicas_per_primary: 1
  base_port: 7500
  enable_cleanup: true

# A real replication experiment would add capability probes, actions, path
# evidence, continuous traffic, and convergence oracles.
