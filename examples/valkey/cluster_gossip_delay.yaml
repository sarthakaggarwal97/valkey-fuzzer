# One primary's cluster links delayed below node timeout (Linux, tc netem with CAP_NET_ADMIN).
scenario_id: cluster-gossip-delay
seed: 43
experiment:
  id: valkey.cluster-gossip-delay
  inputs: {degrade: valkey-0, delay_ms: 100, jitter_ms: 20, degrade_s: 3}
deployment:
  mode: cluster
  primaries: 3
  replicas_per_primary: 1
  base_port: 7540
  addressing: per_instance_loopback
