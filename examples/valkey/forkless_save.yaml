# Forkless BGSAVE on a standalone node with concurrent mutations.
#   valkey-fuzzer run examples/valkey/forkless_save.yaml --output report.json
scenario_id: forkless-save
seed: 123
feature:
  use: valkey.forkless-save
  version: "1"
  with:
    stable_keys: 2000
    mutation_rate: 300
topology:
  type: standalone
  base_port: 7400
