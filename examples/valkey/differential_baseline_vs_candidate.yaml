# Same seeded workload on a baseline and a candidate build: every client
# reply, the final dataset, and the reloaded snapshot must match.
# Point the two artifacts at the builds you want to compare.
differential_id: baseline-vs-candidate
base:
  scenario_id: build-equivalence
  seed: 77
  artifacts:
    baseline:
      use: valkey.local-binary
      with: {path: /opt/valkey-8.1/src/valkey-server}
    candidate:
      use: valkey.local-binary
      with: {path: /opt/valkey/src/valkey-server}
  feature:
    use: valkey.snapshot-equivalence
    version: "1"
    with: {operations: 3000}
  topology:
    type: cluster
    base_port: 7640
variants:
  baseline:
    topology.valkey_binary: {$ref: artifacts.baseline.binary}
  candidate:
    topology.valkey_binary: {$ref: artifacts.candidate.binary}
compare:
  equal:
    - {evidence_id: valkey.dataset.digest, source: dataset, field: digest}
    - {evidence_id: valkey.rdb.reload_verified, source: snapshot, field: content_digest}
    - {evidence_id: valkey.workload.ledger, source: workload, field: replies_digest}
