# Kill the primary under writes and require zero acknowledged-write loss with
# appendfsync always.  For everysec, set loss_window_s to the fsync interval.
scenario_id: aof-durability
seed: 11
experiment:
  id: valkey.aof-durability
  inputs:
    appendfsync: always
    loss_window_s: 0
deployment:
  mode: standalone
  replicas_per_primary: 1
  base_port: 7430
