# Put the node's data on a 32 MB tmpfs, fill it, and require graceful errors
# and recovery (Linux, root).
scenario_id: bgsave-disk-full
seed: 71
resources:
  disk:
    use: valkey.fs.tmpfs
    with: {size_mb: 32}
feature:
  use: valkey.bgsave-disk-full
  version: "1"
  with:
    disk: {$ref: resources.disk.path}
topology:
  type: standalone
  base_port: 7480
  node_data_roots:
    primary: {$ref: resources.disk.path}
