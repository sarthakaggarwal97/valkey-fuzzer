<svg xmlns="http://www.w3.org/2000/svg" width="880" height="210" viewBox="0 0 880 210" role="img" aria-label="An experiment&#x27;s legal space, a seed and a search profile feed the generator, which draws one reproducible scenario" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs><rect width="880" height="210" fill="#ffffff"/><rect x="20" y="20" width="210" height="50" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/><text x="125.0" y="42.0" font-size="14" fill="#0a3069" font-weight="600" text-anchor="middle">Experiment</text><text x="125.0" y="61.0" font-size="12" fill="#59636e" font-weight="400" text-anchor="middle">declares what may vary</text><rect x="20" y="80" width="210" height="50" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/><text x="125.0" y="102.0" font-size="14" fill="#0a3069" font-weight="600" text-anchor="middle">Seed</text><text x="125.0" y="121.0" font-size="12" fill="#59636e" font-weight="400" text-anchor="middle">picks one point</text><rect x="20" y="140" width="210" height="50" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/><text x="125.0" y="162.0" font-size="14" fill="#0a3069" font-weight="600" text-anchor="middle">Search profile</text><text x="125.0" y="181.0" font-size="12" fill="#59636e" font-weight="400" text-anchor="middle">how hard to search</text><rect x="330" y="80" width="160" height="50" rx="10" fill="#fbefff" stroke="#c297ff" stroke-width="1.5"/><text x="410.0" y="110.0" font-size="14" fill="#512a97" font-weight="600" text-anchor="middle">Generator</text><rect x="590" y="80" width="270" height="50" rx="10" fill="#fbefff" stroke="#c297ff" stroke-width="1.5"/><text x="725.0" y="102.0" font-size="14" fill="#512a97" font-weight="600" text-anchor="middle">Scenario</text><text x="725.0" y="121.0" font-size="12" fill="#59636e" font-weight="400" text-anchor="middle">same seed → same scenario</text><path d="M232,45 L280,45 L280,105 L328,105" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><path d="M232,105 L328,105" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><path d="M232,165 L280,165 L280,105 L328,105" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><path d="M492,105 L588,105" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><text x="330" y="162" font-size="12" fill="#59636e" font-weight="400" text-anchor="start">Profiles: pr-quick · nightly-soak · adversarial · candidate</text><text x="330" y="180" font-size="12" fill="#59636e" font-weight="400" text-anchor="start">They change how hard to search, never what a test means.</text></svg>