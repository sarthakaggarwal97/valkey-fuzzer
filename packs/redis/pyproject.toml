[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "valkey-fuzzer-redis-pack"
version = "0.1.0"
description = "Redis OSS as a second target of valkey-fuzzer: a deployment provider, a workload, a fault, oracles, and an experiment"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
dependencies = [
    "valkey-fuzzer",
    # The RESP client the pack's components talk to redis-server with.
    "valkey>=6.0.0",
]

# What build_catalog loads: register(catalog), named after the namespace of the IDs it registers (redis.*).
[project.entry-points."valkey_fuzzer.packs"]
redis = "redis_pack:register"

[tool.setuptools]
packages = ["redis_pack"]

[tool.setuptools.package-data]
redis_pack = ["experiments/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --tb=short -rs -m \"not slow\""
markers = [
    "slow: starts a real redis-server; deselect with -m 'not slow'",
]
