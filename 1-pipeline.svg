<svg xmlns="http://www.w3.org/2000/svg" width="880" height="150" viewBox="0 0 880 150" role="img" aria-label="Scenario, compile, plan, run, verdict, report: one path for every test" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs><rect width="880" height="150" fill="#ffffff"/><rect x="20" y="30" width="122" height="84" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/><text x="81.0" y="61.0" font-size="14" fill="#0a3069" font-weight="600" text-anchor="middle">Scenario</text><text x="81.0" y="80.0" font-size="12" fill="#59636e" font-weight="400" text-anchor="middle">experiment, inputs,</text><text x="81.0" y="96.0" font-size="12" fill="#59636e" font-weight="400" text-anchor="middle">deployment, seed</text><rect x="164" y="30" width="122" height="84" rx="10" fill="#fbefff" stroke="#c297ff" stroke-width="1.5"/><text x="225.0" y="61.0" font-size="14" fill="#512a97" font-weight="600" text-anchor="middle">Compile</text><text x="225.0" y="80.0" font-size="12" fill="#59636e" font-weight="400" text-anchor="middle">strict: nothing</text><text x="225.0" y="96.0" font-size="12" fill="#59636e" font-weight="400" text-anchor="middle">starts if wrong</text><path d="M144,72 L162,72" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><rect x="308" y="30" width="122" height="84" rx="10" fill="#fbefff" stroke="#c297ff" stroke-width="1.5"/><text x="369.0" y="61.0" font-size="14" fill="#512a97" font-weight="600" text-anchor="middle">Plan</text><text x="369.0" y="80.0" font-size="12" fill="#59636e" font-weight="400" text-anchor="middle">frozen,</text><text x="369.0" y="96.0" font-size="12" fill="#59636e" font-weight="400" text-anchor="middle">saved as plan.json</text><path d="M288,72 L306,72" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><rect x="452" y="30" width="122" height="84" rx="10" fill="#fbefff" stroke="#c297ff" stroke-width="1.5"/><text x="513.0" y="61.0" font-size="14" fill="#512a97" font-weight="600" text-anchor="middle">Run</text><text x="513.0" y="80.0" font-size="12" fill="#59636e" font-weight="400" text-anchor="middle">one lifecycle</text><text x="513.0" y="96.0" font-size="12" fill="#59636e" font-weight="400" text-anchor="middle">for every test</text><path d="M432,72 L450,72" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><rect x="596" y="30" width="122" height="84" rx="10" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.5"/><text x="657.0" y="61.0" font-size="14" fill="#116329" font-weight="600" text-anchor="middle">Verdict</text><text x="657.0" y="80.0" font-size="12" fill="#59636e" font-weight="400" text-anchor="middle">PASS · FAIL</text><text x="657.0" y="96.0" font-size="12" fill="#59636e" font-weight="400" text-anchor="middle">ERROR · SKIP</text><path d="M576,72 L594,72" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><rect x="740" y="30" width="122" height="84" rx="10" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.5"/><text x="801.0" y="61.0" font-size="14" fill="#116329" font-weight="600" text-anchor="middle">Report</text><text x="801.0" y="80.0" font-size="12" fill="#59636e" font-weight="400" text-anchor="middle">evidence and how</text><text x="801.0" y="96.0" font-size="12" fill="#59636e" font-weight="400" text-anchor="middle">to reproduce</text><path d="M720,72 L738,72" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><text x="20" y="140" font-size="12" fill="#59636e" font-weight="400" text-anchor="start">Every test, for every feature, takes this path. The engine never knows which feature it is testing.</text></svg>