[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "valkey-fuzzer"
version = "0.2.0"
description = "Seeded fault-injection tests for Valkey standalone and cluster deployments"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "valkey-io"}
]
keywords = ["valkey", "fault-injection", "fuzzing", "chaos-engineering", "testing", "cluster", "failover", "durability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pyyaml>=6.0",
    "valkey[libvalkey]>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    # The neutral plugin template test builds and installs a wheel.
    "setuptools>=64",
    "wheel",
]

[project.urls]
Repository = "https://github.com/valkey-io/valkey-fuzzer"
Issues = "https://github.com/valkey-io/valkey-fuzzer/issues"

[tool.setuptools]
packages = [
    "valkey_fuzzer",
    "valkey_fuzzer.deployment",
    "valkey_fuzzer.deployment.local",
    "valkey_fuzzer.deployment.local.validation",
    "valkey_fuzzer.environment",
    "valkey_fuzzer.extensions",
]

[tool.setuptools.package-data]
valkey_fuzzer = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers --tb=short"
markers = [
    "slow: starts real processes (valkey-server, batch workers); deselect with -m 'not slow'",
    "live: runs the Valkey experiments against real servers (also marked slow)",
]

[tool.coverage.run]
source = ["valkey_fuzzer", "valkey_fuzzer_experiments"]
omit = ["tests/*", "examples/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "SIM102", # collapsible-if (readability preference)
    "SIM105", # suppressible-exception (readability preference)
    "SIM108", # if-else-block-instead-of-if-exp (readability preference)
    "N803",   # argument name should be lowercase (existing API)
    "RUF003", # ambiguous unicode character in comment
]

[tool.ruff.lint.isort]
known-first-party = ["valkey_fuzzer", "valkey_fuzzer_experiments"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
