[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "valkey-fuzzer"
version = "0.1.0"
description = "Topology-aware chaos engineering and fuzzing framework for Valkey"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "valkey-io"}
]
keywords = ["valkey", "standalone", "replication", "cluster", "chaos-engineering", "fuzzing", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pyyaml>=6.0",
    "valkey>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
]

[project.urls]
Repository = "https://github.com/valkey-io/valkey-fuzzer"
Issues = "https://github.com/valkey-io/valkey-fuzzer/issues"

[project.scripts]
valkey-fuzzer = "valkey_fuzzer.cli:main"

# The Valkey component library and feature packs ship in this distribution but
# register like any external extension, through the public plugin entry point.
[project.entry-points."valkey_fuzzer.plugins"]
"valkey-fuzzer.valkey-packs" = "valkey_fuzzer_packs:PLUGIN"

[tool.setuptools.packages.find]
include = ["valkey_fuzzer*"]

[tool.setuptools.package-data]
valkey_fuzzer = ["py.typed"]
valkey_fuzzer_packs = ["packs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["valkey_fuzzer", "valkey_fuzzer_packs"]
omit = ["tests/*", "examples/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "SIM102", # collapsible-if (readability preference)
    "SIM105", # suppressible-exception (readability preference)
    "SIM108", # if-else-block-instead-of-if-exp (readability preference)
    "N803",   # argument name should be lowercase (existing API)
    "RUF003", # ambiguous unicode character in comment
]

[tool.ruff.lint.isort]
known-first-party = ["valkey_fuzzer", "valkey_fuzzer_packs"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
