<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" role="img" aria-label="One run on a timeline: probe, start Valkey, exercise with observers, workload, action and a fault that fires on an event, tear down with undo, then oracles judge" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs><rect width="880" height="440" fill="#ffffff"/><rect x="150" y="20" width="150" height="388" fill="#f6f8fa"/><text x="225.0" y="40" font-size="12" fill="#59636e" font-weight="600" text-anchor="middle">Set up</text><text x="450.0" y="40" font-size="12" fill="#59636e" font-weight="600" text-anchor="middle">Exercise</text><rect x="600" y="20" width="100" height="388" fill="#f6f8fa"/><text x="650.0" y="40" font-size="12" fill="#59636e" font-weight="600" text-anchor="middle">Tear down</text><text x="780.0" y="40" font-size="12" fill="#59636e" font-weight="600" text-anchor="middle">Judge and clean up</text><text x="20" y="85" font-size="13" fill="#1f2328" font-weight="600" text-anchor="start">Capability</text><text x="20" y="131" font-size="13" fill="#1f2328" font-weight="600" text-anchor="start">Valkey</text><text x="20" y="177" font-size="13" fill="#1f2328" font-weight="600" text-anchor="start">Observers</text><text x="20" y="223" font-size="13" fill="#1f2328" font-weight="600" text-anchor="start">Workload</text><text x="20" y="269" font-size="13" fill="#1f2328" font-weight="600" text-anchor="start">Action</text><text x="20" y="327" font-size="13" fill="#1f2328" font-weight="600" text-anchor="start">Fault</text><text x="20" y="373" font-size="13" fill="#1f2328" font-weight="600" text-anchor="start">Oracles</text><rect x="160" y="64" width="100" height="32" rx="8" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/><text x="210.0" y="85.0" font-size="12" fill="#0a3069" font-weight="600" text-anchor="middle">probe</text><rect x="240" y="110" width="610" height="32" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="545.0" y="131.0" font-size="12" fill="#1f2328" font-weight="600" text-anchor="middle">servers running</text><rect x="310" y="156" width="300" height="32" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="460.0" y="177.0" font-size="12" fill="#1f2328" font-weight="600" text-anchor="middle">watch INFO and logs</text><rect x="320" y="202" width="280" height="32" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="460.0" y="223.0" font-size="12" fill="#1f2328" font-weight="600" text-anchor="middle">writes, with a ledger of acked writes</text><rect x="350" y="248" width="150" height="32" rx="8" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.5"/><text x="425.0" y="269.0" font-size="12" fill="#116329" font-weight="600" text-anchor="middle">BGSAVE, failover…</text><rect x="320" y="306" width="60" height="32" rx="8" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/><text x="350.0" y="327.0" font-size="12" fill="#7d4e00" font-weight="600" text-anchor="middle">armed</text><rect x="420" y="306" width="180" height="32" rx="8" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/><text x="510.0" y="327.0" font-size="12" fill="#7d4e00" font-weight="600" text-anchor="middle">kill · pause · partition</text><rect x="620" y="306" width="70" height="32" rx="8" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.5"/><text x="655.0" y="327.0" font-size="12" fill="#116329" font-weight="600" text-anchor="middle">undo</text><path d="M410,280 L410,322 L418,322" fill="none" stroke="#d4a72c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="418" y="298" font-size="11" fill="#7d4e00" font-weight="400" text-anchor="start">fires on the event “save started”</text><rect x="705" y="352" width="140" height="32" rx="8" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.5"/><text x="775.0" y="373.0" font-size="12" fill="#116329" font-weight="600" text-anchor="middle">judge the evidence</text><text x="20" y="428" font-size="12" fill="#59636e" font-weight="400" text-anchor="start">A fault fires on an event, not a timer, so it hits the same moment in every run, and it always undoes itself.</text></svg>