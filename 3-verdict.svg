<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" role="img" aria-label="Verdict: unsupported is SKIP, an unhealthy harness is ERROR, Valkey wrong or no proof the path ran is FAIL, otherwise PASS" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs><rect width="880" height="250" fill="#ffffff"/><rect x="20" y="30" width="140" height="50" rx="25" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="90.0" y="60.0" font-size="13" fill="#1f2328" font-weight="600" text-anchor="middle">Supported?</text><path d="M90.0,80 L90.0,138" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><text x="98.0" y="114" font-size="12" fill="#59636e" font-weight="400" text-anchor="start">no</text><rect x="35" y="140" width="110" height="50" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="90.0" y="162.0" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">SKIP</text><text x="90.0" y="181.0" font-size="12" fill="#59636e" font-weight="400" text-anchor="middle">exit 3</text><rect x="200" y="30" width="140" height="50" rx="25" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="270.0" y="60.0" font-size="13" fill="#1f2328" font-weight="600" text-anchor="middle">Harness healthy?</text><path d="M162,55 L198,55" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><text x="180.0" y="48.0" font-size="12" fill="#59636e" font-weight="400" text-anchor="middle">yes</text><path d="M270.0,80 L270.0,138" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><text x="278.0" y="114" font-size="12" fill="#59636e" font-weight="400" text-anchor="start">no</text><rect x="215" y="140" width="110" height="50" rx="8" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/><text x="270.0" y="162.0" font-size="14" fill="#7d4e00" font-weight="600" text-anchor="middle">ERROR</text><text x="270.0" y="181.0" font-size="12" fill="#59636e" font-weight="400" text-anchor="middle">exit 2</text><rect x="380" y="30" width="140" height="50" rx="25" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="450.0" y="60.0" font-size="13" fill="#1f2328" font-weight="600" text-anchor="middle">Valkey wrong?</text><path d="M342,55 L378,55" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><text x="360.0" y="48.0" font-size="12" fill="#59636e" font-weight="400" text-anchor="middle">yes</text><path d="M450.0,80 L450.0,138" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><text x="458.0" y="114" font-size="12" fill="#59636e" font-weight="400" text-anchor="start">yes</text><rect x="395" y="140" width="110" height="50" rx="8" fill="#ffebe9" stroke="#ff8182" stroke-width="1.5"/><text x="450.0" y="162.0" font-size="14" fill="#82071e" font-weight="600" text-anchor="middle">FAIL</text><text x="450.0" y="181.0" font-size="12" fill="#59636e" font-weight="400" text-anchor="middle">exit 1</text><rect x="560" y="30" width="140" height="50" rx="25" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="630.0" y="60.0" font-size="13" fill="#1f2328" font-weight="600" text-anchor="middle">Proof the path ran?</text><path d="M522,55 L558,55" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><text x="540.0" y="48.0" font-size="12" fill="#59636e" font-weight="400" text-anchor="middle">no</text><path d="M630.0,80 L630.0,138" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><text x="638.0" y="114" font-size="12" fill="#59636e" font-weight="400" text-anchor="start">no</text><rect x="575" y="140" width="110" height="50" rx="8" fill="#ffebe9" stroke="#ff8182" stroke-width="1.5"/><text x="630.0" y="162.0" font-size="14" fill="#82071e" font-weight="600" text-anchor="middle">FAIL</text><text x="630.0" y="181.0" font-size="12" fill="#59636e" font-weight="400" text-anchor="middle">exit 1</text><path d="M702,55 L742,55" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><text x="722.0" y="48.0" font-size="12" fill="#59636e" font-weight="400" text-anchor="middle">yes</text><rect x="744" y="30" width="96" height="50" rx="8" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.5"/><text x="792.0" y="52.0" font-size="14" fill="#116329" font-weight="600" text-anchor="middle">PASS</text><text x="792.0" y="71.0" font-size="12" fill="#59636e" font-weight="400" text-anchor="middle">exit 0</text><text x="20" y="222" font-size="12" fill="#59636e" font-weight="400" text-anchor="start">Harness healthy: every fault undone, every component kept its declarations, nothing timed out, every instance answered.</text><text x="20" y="240" font-size="12" fill="#59636e" font-weight="400" text-anchor="start">Proof the path ran: the required events and evidence were seen, e.g. INFO showed a forkless save actually in progress.</text></svg>