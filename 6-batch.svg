<svg xmlns="http://www.w3.org/2000/svg" width="880" height="150" viewBox="0 0 880 150" role="img" aria-label="Batch: sources fan out to isolated workers, each job is leak-checked, failures are grouped by signature and re-run serially" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs><rect width="880" height="150" fill="#ffffff"/><rect x="20" y="30" width="148" height="84" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/><text x="94.0" y="61.0" font-size="14" fill="#0a3069" font-weight="600" text-anchor="middle">Sources</text><text x="94.0" y="80.0" font-size="12" fill="#59636e" font-weight="400" text-anchor="middle">seeds, files, zoo,</text><text x="94.0" y="96.0" font-size="12" fill="#59636e" font-weight="400" text-anchor="middle">old failures</text><rect x="193" y="30" width="148" height="84" rx="10" fill="#fbefff" stroke="#c297ff" stroke-width="1.5"/><text x="267.0" y="61.0" font-size="14" fill="#512a97" font-weight="600" text-anchor="middle">Workers</text><text x="267.0" y="80.0" font-size="12" fill="#59636e" font-weight="400" text-anchor="middle">parallel and</text><text x="267.0" y="96.0" font-size="12" fill="#59636e" font-weight="400" text-anchor="middle">isolated</text><path d="M170,72 L191,72" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><rect x="366" y="30" width="148" height="84" rx="10" fill="#fbefff" stroke="#c297ff" stroke-width="1.5"/><text x="440.0" y="69.0" font-size="14" fill="#512a97" font-weight="600" text-anchor="middle">Leak check</text><text x="440.0" y="88.0" font-size="12" fill="#59636e" font-weight="400" text-anchor="middle">after every job</text><path d="M343,72 L364,72" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><rect x="539" y="30" width="148" height="84" rx="10" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.5"/><text x="613.0" y="61.0" font-size="14" fill="#116329" font-weight="600" text-anchor="middle">Group</text><text x="613.0" y="80.0" font-size="12" fill="#59636e" font-weight="400" text-anchor="middle">by failure</text><text x="613.0" y="96.0" font-size="12" fill="#59636e" font-weight="400" text-anchor="middle">signature</text><path d="M516,72 L537,72" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><rect x="712" y="30" width="148" height="84" rx="10" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.5"/><text x="786.0" y="61.0" font-size="14" fill="#116329" font-weight="600" text-anchor="middle">Re-run</text><text x="786.0" y="80.0" font-size="12" fill="#59636e" font-weight="400" text-anchor="middle">a sample serially:</text><text x="786.0" y="96.0" font-size="12" fill="#59636e" font-weight="400" text-anchor="middle">reproduced or not</text><path d="M689,72 L710,72" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><text x="20" y="140" font-size="12" fill="#59636e" font-weight="400" text-anchor="start">A batch resumes after a stop. Any failure can be replayed (drift checked first) or minimized.</text></svg>