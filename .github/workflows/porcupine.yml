name: Porcupine checker binaries

# Builds the porcupine linearizability checker (porcupine/) for every platform
# `valkey-fuzzer-fetch-porcupine` fetches, and checks that the
# build reproduces the SHA-256 sums that module pins. On a `porcupine-v*` tag
# the binaries and their sums become the assets of a release of that tag; a
# pull request or dispatch only keeps them as a workflow artifact.

on:
  push:
    tags: [ 'porcupine-v*' ]
  pull_request:
    branches: [ generic-fuzzer ]
    paths:
      - porcupine/**
      - valkey_fuzzer/components/porcupine_sha256sums.txt
      - .github/workflows/porcupine.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: porcupine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    # The exact toolchain, not go.mod's floor: with -trimpath, no cgo and no
    # VCS stamp a Go build is byte-for-byte reproducible only for one version,
    # and the sums the fuzzer pins are the sums of this version's output.
    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version: '1.21.13'
        cache: true
        cache-dependency-path: porcupine/go.sum

    - name: Cross-build the checker
      run: |
        mkdir dist
        for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
          GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 \
            go -C porcupine build -trimpath -buildvcs=false -o "../dist/porcupine-${target%/*}-${target#*/}" .
        done
        (cd dist && sha256sum porcupine-* > SHA256SUMS && cat SHA256SUMS)

    - name: Check the build reproduces the sums the fuzzer pins
      run: |
        diff valkey_fuzzer/components/porcupine_sha256sums.txt dist/SHA256SUMS || {
          echo "the build does not reproduce valkey_fuzzer/components/porcupine_sha256sums.txt: after a change to"
          echo "porcupine/ or to the Go version above, replace that file with dist/SHA256SUMS (the SHA256SUMS of the"
          echo "porcupine-binaries artifact) and move RELEASE_TAG in valkey_fuzzer/components/porcupine.py to a new tag"
          exit 1
        }

    - name: Upload the binaries and their sums
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: porcupine-binaries
        path: dist/
        if-no-files-found: error

  publish:
    # Only a `porcupine-v*` tag: never a pull request or a dispatch. The one job with a write token: it checks
    # out nothing, runs no shell, and reads the files the read-only build job uploaded.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/porcupine-v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
    - name: Download the binaries and their sums
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: porcupine-binaries
        path: ${{ runner.temp }}/dist

    - name: Create the release with the binaries as its assets
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        DIST: ${{ runner.temp }}/dist
        TAG: ${{ github.ref_name }}
      with:
        github-token: ${{ github.token }}
        script: |
          const fs = require('fs');
          const path = require('path');
          const tag = process.env.TAG;
          const release = await github.rest.repos.createRelease({
            ...context.repo,
            tag_name: tag,
            name: `porcupine checker ${tag}`,
            body: 'The porcupine linearizability checker of valkey-fuzzer (porcupine/), built with '
              + 'CGO_ENABLED=0 go build -trimpath for linux/amd64, linux/arm64, darwin/amd64 and darwin/arm64. '
              + "SHA256SUMS lists each asset's SHA-256; valkey-fuzzer-fetch-porcupine fetches and verifies the one "
              + 'for its host. Porcupine is MIT licensed (THIRD_PARTY.md).',
          });
          for (const name of fs.readdirSync(process.env.DIST).sort()) {
            await github.rest.repos.uploadReleaseAsset({
              ...context.repo,
              release_id: release.data.id,
              name,
              data: fs.readFileSync(path.join(process.env.DIST, name)),
              headers: {'content-type': 'application/octet-stream'},
            });
            core.info(`uploaded ${name}`);
          }
