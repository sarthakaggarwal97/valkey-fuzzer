name: Docker Image

# The image of the Dockerfile: the fuzzer, a pinned Valkey build, porcupine, and the faults' tools
# (docs/module-repos.md). A pull request that touches what the image is made of builds it and runs an experiment
# in it, and pushes nothing. A tag (v1.2.3) builds it again and pushes ghcr.io/<owner>/valkey-fuzzer:<tag> and
# :latest; nothing else ever pushes.
on:
  pull_request:
    branches: [generic-fuzzer]
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/build-image.yml
      - pyproject.toml
      - porcupine/**
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build --tag valkey-fuzzer:ci --build-arg "SOURCE_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" .

      # The history oracle needs porcupine and the deployment a valkey-server on PATH: one experiment proves both,
      # as the non-root user the image runs as. A report folder is left in the container's /tmp, so none is uploaded.
      - name: Run an experiment in the image
        run: |
          docker run --rm valkey-fuzzer:ci --version
          docker run --rm valkey-fuzzer:ci run /opt/valkey-fuzzer/examples/valkey/aof_durability.yaml --timeout 300

      - name: Write the image size to the job summary
        run: |
          {
            echo "## Docker image"
            echo
            echo "- Size: $(docker image inspect valkey-fuzzer:ci --format '{{.Size}}' | numfmt --to=iec-i --suffix=B)"
            echo "- Valkey: $(docker run --rm --entrypoint cat valkey-fuzzer:ci /opt/valkey/COMMIT)"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    # A tag only: a pull request or a dispatch never pushes.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # A registry path is lowercase; a repository owner need not be.
      - name: Build the image
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${OWNER,,}/valkey-fuzzer"
          docker build --tag "${image}:${TAG}" --tag "${image}:latest" \
            --build-arg "SOURCE_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" .
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      # The token reaches only this step: the build above ran the Dockerfile without it.
      - name: Push the image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          TAG: ${{ github.ref_name }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${REGISTRY_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"
          echo "- Pushed \`${IMAGE}:${TAG}\` and \`${IMAGE}:latest\`" >> "$GITHUB_STEP_SUMMARY"
