name: Valkey Fuzzer Cluster Chaos Every 4 Hours

# Three fresh valkey.cluster-chaos seeds through the batch runner, every four hours.
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  random-fuzzer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FUZZER_ARTIFACT_DIR: /tmp/valkey-fuzzer/artifacts
      # The batch folder; valkey-ci-agent's fuzzer monitor reads batch/summary.json
      # and, for each entry of its runs, the run report at batch/<runs[].report>.
      FUZZER_BATCH_DIR: /tmp/valkey-fuzzer/artifacts/batch
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    
    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install -e .
    
    - name: Run the fuzzer batch
      run: |
        mkdir -p "${FUZZER_ARTIFACT_DIR}"
        echo "========================================"
        echo "Random Fuzzer Batch"
        echo "Timestamp: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
        echo "========================================"
        # Three fresh cluster chaos seeds, one at a time; the batch folder holds
        # each run's own report (runs/<id>/report.json) and summary.json.
        valkey-fuzzer batch --random valkey.cluster-chaos --seeds 3 --profile nightly-soak --timeout 900 \
          --out "${FUZZER_BATCH_DIR}"

    - name: Print Valkey node logs
      if: always()
      run: |
        echo ""
        echo "========================================"
        echo "Valkey Node Logs"
        echo "========================================"
        found=0
        for logfile in "${FUZZER_BATCH_DIR}"/runs/*/logs/*.log; do
          if [ -f "$logfile" ]; then
            found=1
            echo ""
            echo "--- ${logfile#"${FUZZER_BATCH_DIR}"/} ---"
            cat "$logfile"
          fi
        done
        if [ "$found" = 0 ]; then
          echo "No Valkey logs found under ${FUZZER_BATCH_DIR}/runs"
        fi

    - name: Prepare analysis bundle
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        python - <<'PY'
        import json
        import os
        from pathlib import Path

        batch = Path(os.environ["FUZZER_BATCH_DIR"])
        artifact_dir = Path(os.environ["FUZZER_ARTIFACT_DIR"])
        # summary.json lists every run; runs[].report is that run's own run report.
        summary_file = batch / "summary.json"
        summary = json.loads(summary_file.read_text()) if summary_file.exists() else {"runs": []}

        lines = ["## Fuzzer Run Artifact Bundle", ""]
        if summary_file.exists():
            lines.append(f"- Batch status: `{summary['status']}`; runs by status: `{summary['counts']}`")
        for run in summary["runs"]:
            if not run["report"]:
                lines.append(f"- Run `{run['id']}`: `{run['status']}`, no run report: {run['summary']}")
                continue
            report = json.loads((batch / run["report"]).read_text())
            result = report.get("outcome") or {}
            plan = result.get("plan") or {}
            folder = (batch / run["report"]).parent.relative_to(artifact_dir)
            lines.append(f"- Scenario: `{plan.get('scenario_id')}`")
            lines.append(f"  - Seed: `{plan.get('seed')}`")
            lines.append(f"  - Status: `{result.get('status')}`")
            lines.append(f"  - Summary: {result.get('summary')}")
            lines.append(f"  - Valkey SHA: `{result.get('valkey_sha')}`")
            for item in result.get("component_results") or []:
                if item.get("status") in ("FAIL", "ERROR"):
                    lines.append(f"  - Failed: {item.get('component_id')}: {item.get('summary')}")
            lines.append(f"  - Reproduce: `valkey-fuzzer run {folder}/scenario.yaml`")
        if not summary["runs"]:
            lines.append("- No run folders were written.")
        for group in summary.get("signatures", []):
            lines.append(f"- Signature ({group['count']} run(s)): {group['label']}")

        collected = sum(1 for path in artifact_dir.rglob("*") if path.is_file())
        lines.append(f"- Collected files: `{collected}`")
        lines.append("")

        summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
        if summary_path:
            with open(summary_path, "a", encoding="utf-8") as handle:
                handle.write("\n".join(lines) + "\n")
        PY

    - name: Upload fuzzer run artifacts
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: fuzzer-run-artifacts-${{ github.run_id }}
        path: ${{ env.FUZZER_ARTIFACT_DIR }}
        if-no-files-found: warn
        retention-days: 60
