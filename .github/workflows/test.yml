name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install project
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e '.[dev]'

    - name: Run unit tests
      run: python -m pytest -m "not slow"

    # The tests run from the checkout, where formal/ is on disk; an installed
    # wheel finds the spec bundles only if packaging mapped them in.
    - name: Check the wheel ships every spec bundle file
      if: matrix.python-version == '3.12'
      run: |
        python -m pip wheel --no-deps --wheel-dir dist .
        python -m zipfile -l dist/valkey_fuzzer-*.whl > wheel-files.txt
        missing=0
        for path in $(cd formal && find . -type f ! -name '.*' | sed 's|^\./||'); do
          grep -qF "valkey_fuzzer/formal/$path " wheel-files.txt || { echo "the wheel lacks formal/$path"; missing=1; }
        done
        exit "$missing"

  server-tests:
    # Tests that start real valkey-server processes, plus a live subset of the
    # Valkey experiments that needs neither root nor a second build. The full
    # live suite runs daily in valkey-experiments-live.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.12'

    - name: Build Valkey unstable
      run: |
        git clone --depth 1 https://github.com/valkey-io/valkey.git /tmp/valkey-unstable
        make -C /tmp/valkey-unstable -j"$(nproc)"
        echo "/tmp/valkey-unstable/src" >> "$GITHUB_PATH"

    - name: Install project
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e '.[dev]'

    - name: Run server tests
      run: python -m pytest -m "slow and not live"

    - name: Run the live experiment subset
      run: |
        python -m pytest -q -rs -m live tests/test_live_valkey_experiments.py \
          -k "aof-durability or replication- or cluster-chaos or forkless-save-with-fork or data_only_experiment"
