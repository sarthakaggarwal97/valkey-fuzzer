name: Tests

on:
  push:
    branches: [ generic-fuzzer ]
  pull_request:
    branches: [ generic-fuzzer ]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: false

env:
  # The tla2tools.jar that tla-model-check.yml pins: the server tests, the spec
  # bridge's live test, and the conform half of the election test need it.
  TLA_TOOLS_VERSION: v1.7.4
  TLA_TOOLS_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install project
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e '.[dev]'

    # tests/test_history.py builds the porcupine checker with it.
    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: porcupine/go.mod
        cache: true
        cache-dependency-path: porcupine/go.sum

    # tests/test_packaging.py builds the sdist and the wheel and checks what they ship (the spec bundles among it).
    - name: Run unit tests
      run: python -m pytest -m "not slow"

  server-tests:
    # Tests that start real valkey-server processes, plus a live subset of the
    # Valkey experiments that needs neither root nor a second build, on the
    # Valkey commit the bug zoo pins: a Valkey regression cannot turn an
    # unrelated fuzzer PR red, and two runs of one commit agree. The full live
    # suite runs daily on unstable in valkey-experiments-live.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: pyproject.toml

    # The build takes about 90 s and changes only with the pinned commit. The whole tree is kept, not only
    # src/valkey-server: the config table is read from the config.c beside the binary (components/config_space.py).
    - name: Restore the Valkey build
      id: valkey-build
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /tmp/valkey
        key: valkey-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('zoo/valkey-commit') }}

    - name: Build Valkey at the pinned commit
      if: steps.valkey-build.outputs.cache-hit != 'true'
      run: |
        git init --quiet /tmp/valkey
        git -C /tmp/valkey fetch --quiet --depth 1 https://github.com/valkey-io/valkey.git "$(tr -d '[:space:]' < zoo/valkey-commit)"
        git -C /tmp/valkey checkout --quiet FETCH_HEAD
        make -C /tmp/valkey -j"$(nproc)"

    - name: Put Valkey on PATH
      run: echo "/tmp/valkey/src" >> "$GITHUB_PATH"

    - name: Install project
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e '.[dev]'

    # valkey.oracle.history runs the porcupine linearizability checker from PATH.
    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: porcupine/go.mod
        cache: true
        cache-dependency-path: porcupine/go.sum

    - name: Build the porcupine checker
      run: |
        go -C porcupine build -o "${RUNNER_TEMP}/bin/porcupine"
        echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

    - name: Set up Java
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: '17'

    - name: Download tla2tools.jar
      shell: bash
      run: |
        curl -fsSL --retry 3 -o "${RUNNER_TEMP}/tla2tools.jar" \
          "https://github.com/tlaplus/tlaplus/releases/download/${TLA_TOOLS_VERSION}/tla2tools.jar"
        echo "${TLA_TOOLS_SHA256}  ${RUNNER_TEMP}/tla2tools.jar" | sha256sum -c -

    - name: Run server tests
      env:
        TLA2TOOLS_JAR: ${{ runner.temp }}/tla2tools.jar
      run: python -m pytest -m "slow and not live"

    # With the spec bridge's register bundle end to end: translated, run on Valkey, conformed with TLC.
    - name: Run the live experiment subset
      env:
        TLA2TOOLS_JAR: ${{ runner.temp }}/tla2tools.jar
      run: |
        python -m pytest -q -rs -m live tests/test_live_spec_register.py tests/test_live_valkey_experiments.py \
          -k "aof-durability or replication- or cluster-chaos or slot-migration-chaos or data_only_experiment or register_counterexample"

  redis-pack:
    # The second target (docs/second-target.md): the redis pack under packs/redis, installed from its own
    # pyproject.toml next to the fuzzer, its tests on a fake process, then its shipped experiment once against
    # Redis OSS at the commit packs/redis/redis-commit pins. The unit tests above run without the pack: the
    # Valkey catalog they check must hold the Valkey components alone.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: pyproject.toml

    # The build takes about two minutes and changes only with the pinned commit.
    - name: Restore the Redis build
      id: redis-build
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /tmp/redis
        key: redis-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packs/redis/redis-commit') }}

    - name: Build Redis at the pinned commit
      if: steps.redis-build.outputs.cache-hit != 'true'
      run: |
        git init --quiet /tmp/redis
        git -C /tmp/redis fetch --quiet --depth 1 https://github.com/redis/redis.git "$(tr -d '[:space:]' < packs/redis/redis-commit)"
        git -C /tmp/redis checkout --quiet FETCH_HEAD
        make -C /tmp/redis -j"$(nproc)"

    - name: Put Redis on PATH
      run: echo "/tmp/redis/src" >> "$GITHUB_PATH"

    - name: Install the fuzzer and the pack
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e '.[dev]' -e packs/redis

    - name: Run the pack's tests on a fake process
      run: python -m pytest -m "not slow" packs/redis

    # The example scenario takes redis-server from PATH; a PASS exits 0.
    - name: Run the shipped experiment against Redis
      run: valkey-fuzzer run examples/redis/kill_restart.yaml --verbose
