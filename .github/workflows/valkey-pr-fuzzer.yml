name: Valkey Fuzzer Framework Acceptance (Interim)

on:
  workflow_call:
    inputs:
      fuzzer_repository:
        description: Exact repository containing the fuzzer code
        required: true
        type: string
      fuzzer_ref:
        description: Exact branch, tag, or commit of the fuzzer code
        required: true
        type: string
      valkey_repository:
        description: Repository containing the Valkey ref to build
        required: false
        type: string
        default: valkey-io/valkey
      valkey_ref:
        description: Exact Valkey branch, tag, commit, or pull-request merge ref
        required: true
        type: string
  workflow_dispatch:
    inputs:
      fuzzer_repository:
        description: Optional alternate fuzzer repository; defaults to this repository
        required: false
        type: string
        default: ""
      fuzzer_ref:
        description: Optional alternate fuzzer ref; defaults to this workflow commit
        required: false
        type: string
        default: ""
      valkey_repository:
        description: Repository containing the Valkey ref to build
        required: false
        type: string
        default: valkey-io/valkey
      valkey_ref:
        description: Exact Valkey branch, tag, commit, or pull-request merge ref
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: valkey-fuzzer-framework-acceptance-${{ inputs.valkey_repository || 'valkey-io/valkey' }}-${{ inputs.valkey_ref }}
  cancel-in-progress: false

jobs:
  build-valkey:
    name: Build requested Valkey ref
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      resolved_sha: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Checkout Valkey
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ inputs.valkey_repository || 'valkey-io/valkey' }}
          ref: ${{ inputs.valkey_ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev tcl

      - name: Build Valkey
        run: |
          make -j"$(nproc)"
          src/valkey-server --version

      - name: Capture resolved SHA
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  framework-acceptance:
    name: Validate generic fuzzer framework
    needs: build-valkey
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout valkey-fuzzer
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ inputs.fuzzer_repository || github.repository }}
          ref: ${{ inputs.fuzzer_ref || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run generic framework acceptance tests
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/test_cli.py \
            tests/test_extensibility.py \
            tests/test_feature_packs.py \
            tests/test_feature_runner.py \
            tests/test_feature_runtime.py \
            tests/test_local_topology_provider.py \
            2>&1 | tee framework-acceptance.log

      - name: Validate public scenarios
        run: |
          for scenario in \
            examples/standalone_scenario.yaml \
            examples/replication_scenario.yaml \
            examples/cluster_scenario.yaml
          do
            valkey-fuzzer validate "${scenario}" \
              --feature-pack-dir examples/feature-packs \
              --no-plugins
          done

      - name: Explain current gate
        env:
          VALKEY_REPOSITORY: ${{ inputs.valkey_repository || 'valkey-io/valkey' }}
          VALKEY_REF: ${{ inputs.valkey_ref }}
          RESOLVED_SHA: ${{ needs.build-valkey.outputs.resolved_sha }}
          FUZZER_REPOSITORY: ${{ inputs.fuzzer_repository || github.repository }}
          FUZZER_REF: ${{ inputs.fuzzer_ref || github.sha }}
        run: |
          {
            echo "## Valkey Fuzzer Framework Acceptance"
            echo
            echo "- Valkey target: \`${VALKEY_REPOSITORY}@${VALKEY_REF}\`"
            echo "- Resolved Valkey SHA: \`${RESOLVED_SHA}\`"
            echo "- Fuzzer source: \`${FUZZER_REPOSITORY}@${FUZZER_REF}\`"
            echo "- Framework unit and structural acceptance: \`PASS\`"
            echo
            echo "> This is an interim framework gate. It verifies that the requested"
            echo "> Valkey ref builds and that the generic fuzzer compiler/runtime"
            echo "> passes acceptance checks. No Valkey feature-fuzzing verdict is"
            echo "> produced until complete built-in feature packs are available."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload acceptance log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: valkey-fuzzer-framework-acceptance
          path: framework-acceptance.log
          if-no-files-found: warn
          retention-days: 30
