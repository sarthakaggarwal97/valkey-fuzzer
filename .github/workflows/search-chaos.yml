name: Valkey Search Chaos Every 6 Hours

# valkey-search's data under faults: indexes and hashes written before and while a replica is killed, stopped or
# restarted (and the primary stalled), then searched on every instance and digested against the primary, on
# Valkey unstable with ASan and valkey-search main. The experiment is .github/scripts/module_chaos.py's
# proposed.search-chaos; valkey-json and valkey-bloom run the same way on the soak hosts. Every server starts with
# valkey-search's check of an index before it is saved on (search.rdb-validate-on-write, set beside loadmodule),
# and a save that fails the check fails its run; a valkey-search without the option does not start.
on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:
    inputs:
      seeds:
        description: "Fresh seeds"
        required: false
        default: "120"
        type: string

permissions:
  contents: read

concurrency:
  group: search-chaos-${{ github.ref }}
  cancel-in-progress: false

env:
  # valkey-search's build dependencies, from https://github.com/valkey-io/valkey-search/releases: update the
  # release and the SHA-256 of the asset together.
  SEARCH_DEPS_RELEASE: 1.0.0-rc1
  SEARCH_DEPS_SHA256: 2aba36cafd6a94c54ca11a15409e86db2705bfa8fe38fbd9c5c4c758dca3c69f

jobs:
  search-chaos:
    # The schedule runs only in the repositories that own it; any repository can dispatch it.
    if: github.event_name != 'schedule' || github.repository == 'valkey-io/valkey-fuzzer' || github.repository == 'sarthakaggarwal97/valkey-fuzzer'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      BATCH_DIR: /tmp/search-chaos/batch
      # Valkey's own test harness's setting; the module's allocations live to shutdown, so leaks are not judged.
      ASAN_OPTIONS: allocator_may_return_null=1:quarantine_size_mb=16:detect_leaks=0
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python and install the fuzzer
        uses: ./.github/actions/setup-fuzzer
        with:
          python-version: '3.11'

      - name: Install the build tools and valkey-search's dependencies
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q build-essential clang cmake ninja-build pkg-config libssl-dev libzstd-dev
          curl -fsSL --retry 3 -o /tmp/deps.deb \
            "https://github.com/valkey-io/valkey-search/releases/download/${SEARCH_DEPS_RELEASE}/valkey-search-deps-ubuntu-noble-amd64.deb"
          echo "${SEARCH_DEPS_SHA256}  /tmp/deps.deb" | sha256sum -c -
          sudo dpkg -i /tmp/deps.deb

      - name: Build Valkey unstable with ASan
        uses: ./.github/actions/build-valkey
        with:
          ref: unstable
          path: /tmp/valkey
          make-args: BUILD_ZSTD=yes CC=clang OPT=-O1 SANITIZER=address

      - name: Build valkey-search main
        run: |
          git clone --depth 1 https://github.com/valkey-io/valkey-search.git /tmp/valkey-search
          cd /tmp/valkey-search && ./build.sh
          ls -la .build-release/libsearch.so

      - name: Write the experiment
        run: |
          python .github/scripts/module_chaos.py /tmp/search-chaos/experiments
          printf '%s\n' 'deployment:' '  server_config:' \
            '    loadmodule: /tmp/valkey-search/.build-release/libsearch.so' \
            '    search.rdb-validate-on-write: "yes"' \
            > /tmp/search-chaos/base.yaml

      - name: Run the chaos batch
        env:
          SEEDS: ${{ inputs.seeds || '120' }}
        run: |
          # At most one always-active IO thread a server: three (io-threads 4) take more than a runner's four cores.
          # No swapdb load: a replica's full sync with it aborts in valkey-search (fuzzer issue #77, still open),
          # which failed one seed in ten here and hid everything else those seeds could find.
          valkey-fuzzer batch --random proposed.search-chaos --seeds "${SEEDS}" --workers 3 \
            --exclude server_config.io-threads=4 --exclude server_config.repl-diskless-load=swapdb \
            --base /tmp/search-chaos/base.yaml --experiment-dir /tmp/search-chaos/experiments \
            --profile nightly-soak --serial-reruns 2 --prune-pass --timeout 1800 \
            --valkey-binary /tmp/valkey/src/valkey-server --artifact-dir /tmp/search-chaos/artifacts --out "${BATCH_DIR}"

      - name: Summarize the batch
        if: always()
        env:
          SUMMARY_TITLE: Valkey Search Chaos
        run: python .github/scripts/ci.py summary

      - name: Upload the batch
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: search-chaos-artifacts-${{ github.run_id }}
          path: /tmp/search-chaos
          if-no-files-found: warn
          retention-days: 60
