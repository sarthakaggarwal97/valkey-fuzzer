name: Module Fuzz

# The reusable workflow a Valkey module repository (valkey-json, valkey-bloom, valkey-search) calls to run the
# fuzzer against its module (docs/module-repos.md): it checks the module repository out, builds the module (or
# takes a prebuilt one from an artifact), loads it into every server of a batch of random seeds of an experiment
# (example.module-chaos by default: the module's own commands under process faults), uploads the batch folder,
# and fails only on a FAIL: an ERROR (the harness, not the module) is written to the job summary.
#
# Two ways to run, one input apart: with `image`, the job runs in the published image (its pinned Valkey, its
# porcupine, its tools; docs/module-repos.md#the-image), else on the runner, which builds Valkey at
# `valkey_version` and the porcupine checker itself. A called workflow's github.repository and github.sha are its
# caller's, so the caller names the fuzzer's own commit in `fuzzer_ref`: the same tag or SHA as its `uses:`.
on:
  workflow_call:
    inputs:
      module:
        description: "Path of the module's .so in the module repository's checkout, once built (.build-release/libsearch.so)"
        required: true
        type: string
      build:
        description: "Shell command that builds the module, run in the module repository's checkout; empty when `module` already exists (see module_artifact)"
        required: false
        type: string
        default: ""
      module_artifact:
        description: "Name of an artifact an earlier job uploaded, unpacked into the checkout before the build: a prebuilt module"
        required: false
        type: string
        default: ""
      experiment:
        description: "The experiment to draw seeds of: example.module-chaos, a shipped one, or a proposed.* one in experiment_dir"
        required: false
        type: string
        default: example.module-chaos
      experiment_dir:
        description: "Directory of data-only experiments in the module repository (--experiment-dir)"
        required: false
        type: string
        default: ""
      base:
        description: "A partial scenario file in the module repository, merged over every draw: the inputs of example.module-chaos (its commands), server config beside loadmodule"
        required: false
        type: string
        default: ""
      seeds:
        description: Fresh seeds of the experiment
        required: false
        type: number
        default: 20
      workers:
        description: Parallel workers (a run takes about four cores)
        required: false
        type: number
        default: 2
      profile:
        description: "Search profile: pr-quick, nightly-soak, adversarial"
        required: false
        type: string
        default: pr-quick
      run_timeout_s:
        description: Deadline of one run, in seconds
        required: false
        type: number
        default: 900
      timeout_minutes:
        description: Deadline of the job
        required: false
        type: number
        default: 120
      fail_on_error:
        description: Fail the job on an ERROR or a SKIP_UNSUPPORTED too, not only on a FAIL
        required: false
        type: boolean
        default: false
      image:
        description: "The published image to run in (ghcr.io/valkey-io/valkey-fuzzer:v1.2.3); empty runs on the runner"
        required: false
        type: string
        default: ""
      valkey_version:
        description: "On the runner: the tag, branch or commit of valkey-io/valkey to build; the image's build otherwise"
        required: false
        type: string
        default: 9.1.3
      valkey_make_args:
        description: "On the runner: arguments added to make (SANITIZER=address CC=clang)"
        required: false
        type: string
        default: ""
      fuzzer_repository:
        description: The fuzzer repository to check out
        required: false
        type: string
        default: valkey-io/valkey-fuzzer
      fuzzer_ref:
        description: "The fuzzer commit to check out: the tag or SHA `uses:` names"
        required: true
        type: string
      artifact_name:
        description: Name of the uploaded batch folder
        required: false
        type: string
        default: module-fuzz-${{ github.run_id }}

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    # A called workflow has no run of its own, so the group is the job's: one caller's runs of one module and
    # experiment on one ref queue behind each other (a schedule that outlasts its interval), while its calls for
    # other modules or experiments run beside them.
    concurrency:
      group: module-fuzz-${{ github.repository }}-${{ github.ref }}-${{ inputs.module }}-${{ inputs.experiment }}
      cancel-in-progress: false
    # An empty image is no container: the job runs on the runner.
    container: ${{ inputs.image }}
    defaults:
      run:
        # A container job's default shell is sh; the steps below use bash arrays.
        shell: bash
    env:
      BATCH_DIR: ${{ github.workspace }}/module-fuzz/batch
      MODULE_DIR: ${{ github.workspace }}/module
    steps:
      - name: Checkout valkey-fuzzer
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ inputs.fuzzer_repository }}
          ref: ${{ inputs.fuzzer_ref }}
          persist-credentials: false

      - name: Checkout the module repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: module
          persist-credentials: false

      - name: Set up Python
        if: inputs.image == ''
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      # About 90 s, not cached: a branch (unstable) moves, and a cache keyed on its name would freeze its first
      # build. The whole tree is kept, not only src/valkey-server: the config table is read from the config.c beside
      # the binary. A tag or branch and a commit SHA are fetched the same way.
      - name: Build Valkey
        if: inputs.image == ''
        env:
          VALKEY_VERSION: ${{ inputs.valkey_version }}
          MAKE_ARGS: ${{ inputs.valkey_make_args }}
        run: |
          git init --quiet /tmp/valkey
          git -C /tmp/valkey fetch --quiet --depth 1 https://github.com/valkey-io/valkey.git "${VALKEY_VERSION}"
          git -C /tmp/valkey checkout --quiet FETCH_HEAD
          # The make arguments are words (SANITIZER=address CC=clang), so they are not quoted.
          # shellcheck disable=SC2086
          make -C /tmp/valkey -j"$(nproc)" ${MAKE_ARGS}
          echo "/tmp/valkey/src" >> "${GITHUB_PATH}"

      - name: Set up Go
        if: inputs.image == ''
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: porcupine/go.mod
          cache: true
          cache-dependency-path: porcupine/go.sum

      # valkey.oracle.history runs the porcupine linearizability checker from PATH.
      - name: Build the porcupine checker
        if: inputs.image == ''
        run: |
          go -C porcupine build -o "${RUNNER_TEMP}/bin/porcupine"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      # In the image too: the checkout is the fuzzer the caller pinned, the image's install may be older.
      - name: Install the fuzzer
        run: python -m pip install --root-user-action ignore .

      - name: Download the prebuilt module
        if: inputs.module_artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.module_artifact }}
          path: module

      - name: Build the module
        if: inputs.build != ''
        working-directory: module
        env:
          MODULE_BUILD: ${{ inputs.build }}
        run: bash -euo pipefail -c "${MODULE_BUILD}"

      - name: Write the batch's base file
        id: base
        env:
          MODULE: ${{ inputs.module }}
          BASE: ${{ inputs.base }}
          BASE_OUT: ${{ github.workspace }}/module-fuzz/base.yaml
        run: |
          test -f "${MODULE_DIR}/${MODULE}" || { echo "::error::no module at module/${MODULE}"; exit 1; }
          mkdir -p "$(dirname "${BASE_OUT}")"
          MODULE_PATH="${MODULE_DIR}/${MODULE}" BASE_FILE="${BASE:+${MODULE_DIR}/${BASE}}" python .github/scripts/ci.py module-base
          echo "file=${BASE_OUT}" >> "$GITHUB_OUTPUT"

      # The exit code is the batch's verdict (docs/cli.md#exit-codes): 0 PASS, 1 FAIL, 2 ERROR, 3 unsupported.
      # The next step decides what fails the job, so the summary and the upload always run.
      - name: Run the batch
        id: batch
        env:
          EXPERIMENT: ${{ inputs.experiment }}
          EXPERIMENT_DIR: ${{ inputs.experiment_dir }}
          SEEDS: ${{ inputs.seeds }}
          WORKERS: ${{ inputs.workers }}
          PROFILE: ${{ inputs.profile }}
          RUN_TIMEOUT_S: ${{ inputs.run_timeout_s }}
          BASE_FILE: ${{ steps.base.outputs.file }}
        run: |
          experiment_dirs=(--experiment-dir examples/valkey/experiments)
          if [ -n "${EXPERIMENT_DIR}" ]; then
            experiment_dirs+=(--experiment-dir "${MODULE_DIR}/${EXPERIMENT_DIR}")
          fi
          set +e
          valkey-fuzzer batch --random "${EXPERIMENT}" --seeds "${SEEDS}" --workers "${WORKERS}" --profile "${PROFILE}" \
            --base "${BASE_FILE}" "${experiment_dirs[@]}" --timeout "${RUN_TIMEOUT_S}" \
            --artifact-dir "${GITHUB_WORKSPACE}/module-fuzz/artifacts" --out "${BATCH_DIR}"
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Summarize the batch
        if: always()
        env:
          SUMMARY_TITLE: Module Fuzz
          MODULE_REPOSITORY: ${{ github.repository }}
          MODULE_SHA: ${{ github.sha }}
        run: python .github/scripts/ci.py summary

      - name: Upload the batch
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ github.workspace }}/module-fuzz
          if-no-files-found: warn
          retention-days: 60

      - name: Fail on FAIL
        env:
          CODE: ${{ steps.batch.outputs.code }}
          FAIL_ON_ERROR: ${{ inputs.fail_on_error }}
        run: |
          case "${CODE}" in
            0) echo "PASS" ;;
            1) echo "::error::the batch found a FAIL: see the job summary and the uploaded batch folder"; exit 1 ;;
            2|3) echo "::warning::the batch ended with exit code ${CODE} (2 ERROR, 3 unsupported): no verdict on the module"
                 [ "${FAIL_ON_ERROR}" = "true" ] && exit 1 || true ;;
            *) echo "::error::valkey-fuzzer batch exited with code ${CODE}"; exit 1 ;;
          esac
