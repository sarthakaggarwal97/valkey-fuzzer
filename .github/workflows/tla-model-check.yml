name: TLA+ Model Check

# Runs `valkey-fuzzer spec check` on every spec bundle under formal/: SANY,
# TLC on each expected-safe config (must find no error), TLC on each negative
# control (must find its named violation, or the claim is vacuous), model
# coverage, and mapping completeness. Each bundle's assurance report is
# uploaded. The spec bridge's own TLC tests (a toy bundle built from
# fixtures, the cluster-election claims on canned traces, the replication
# model's counterexample of fuzzer issue #133, the slot migration model's
# cancel after the grant, and the persistence model's manifest written before
# its base) run here too,
# since they need java and tla2tools.jar. It runs on every change: the
# experiment gate compiles the Valkey experiments with the core compiler, so a
# change almost anywhere can break the translated scenarios.

on:
  push:
    branches: [ generic-fuzzer ]
  pull_request:
    branches: [ generic-fuzzer ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tla-model-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tlc:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python and install project
        uses: ./.github/actions/setup-fuzzer
        with:
          python-version: '3.12'
          extras: dev

      # The tla2tools.jar release CI pins lives in the action (and in valkey_fuzzer/spec/tla.py).
      - name: Set up Java and tla2tools.jar
        uses: ./.github/actions/tla-tools

      - name: spec check every bundle
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "${RUNNER_TEMP}/assurance"
          status=0
          for claims in formal/*/claims.yaml; do
            bundle="$(dirname "${claims}")"
            name="$(basename "${bundle}")"
            echo "::group::spec check ${bundle}"
            valkey-fuzzer spec check "${bundle}" --strict --tla2tools "${RUNNER_TEMP}/tla2tools.jar" \
              --output "${RUNNER_TEMP}/assurance/${name}.json" || status=1
            echo "::endgroup::"
          done
          exit "${status}"

      - name: Spec bridge tests
        env:
          TLA2TOOLS_JAR: ${{ runner.temp }}/tla2tools.jar
        run: |
          python -m pytest -q -m "" tests/test_spec_bridge.py tests/test_replication_model.py \
            tests/test_slot_migration_model.py tests/test_persistence_model.py \
            tests/test_cluster_election.py::test_conform_checks_the_election_claims_with_tlc

      - name: Upload assurance reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spec-assurance
          path: ${{ runner.temp }}/assurance
          if-no-files-found: warn
