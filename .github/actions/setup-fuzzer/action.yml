name: Set up the fuzzer
description: Python with the pip cache keyed on pyproject.toml, and the project installed in editable mode.

inputs:
  python-version:
    description: The Python version to set up
    required: true
  extras:
    description: "The extras to install with the project: dev, or none"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml

    # "." without extras, ".[dev]" with them.
    - name: Install project
      shell: bash
      env:
        EXTRAS: ${{ inputs.extras }}
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".${EXTRAS:+[${EXTRAS}]}"
