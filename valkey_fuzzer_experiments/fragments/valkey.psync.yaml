# valkey.base plus the PSYNC procedure: run writes for `disconnect_after_s`,
# drop every replica link from the primary side (CLIENT KILL TYPE replica, as
# the `drop-replica-links` fault), and wait until every replica's link is up
# again (`links-up`). The `info` observer requires sync_partial_ok to advance
# with no new full sync, the `logs` observer requires both sides to log the
# PSYNC handshake and forbids a full resync, and the `data` oracle requires
# every replica to converge. Needs replicas; experiments add their own steps,
# name what `links-up` waits for in its depends_on, and choose the `info`
# sections.
extends: [valkey.base]
deployment:
  modes: [standalone, cluster]
  replicas_per_primary: {minimum: 1}
metadata:
  generator:
    deployment:
      standalone: {replicas_per_primary: {minimum: 1, maximum: 3}}
      cluster: {replicas_per_primary: {minimum: 1, maximum: 2}}
    inputs:
      disconnect_after_s: {minimum: 0.5, maximum: 3}
inputs:
  properties:
    stable_keys: {default: 500}
    mutable_keys: {default: 300}
    mutation_rate: {minimum: 1, default: 400}
    disconnect_after_s: {type: number, minimum: 0, maximum: 600, default: 1}
components:
  - use: valkey.observer.info
    id: info
    config:
      instances: primaries
      interval_s: 0.1
      expectations:
        - {evidence_id: valkey.replication.partial-resync-counted, field: sync_partial_ok, delta_min: 1, required: true}
        - {evidence_id: valkey.replication.no-full-resync, field: sync_full, delta_max: 0, instances: all, required: true}

  - use: valkey.observer.log
    id: logs
    config:
      instances: all
      expect:
        - {evidence_id: valkey.replication.psync-accepted-logged, pattern: "Partial resynchronization request from .* accepted", required: true}
        - {evidence_id: valkey.replication.psync-succeeded-logged, pattern: "Successful partial resynchronization with primary", required: true}
      forbidden:
        - {pattern: "Full resync from primary"}

  - use: valkey.workload.key-value
    id: writes
    config:
      mix: {set: 0.8, del: 0.1, get: 0.1}

  - use: valkey.fault.command
    id: drop-replica-links
    config:
      when_event: run-then-disconnect.completed
      instance: primaries
      command: [CLIENT, KILL, TYPE, replica]

  - use: valkey.action.sleep
    id: run-then-disconnect
    depends_on: [writes, info, logs, drop-replica-links]
    config: {seconds: {$ref: inputs.disconnect_after_s}}

  - use: valkey.action.poll
    id: links-up
    config:
      instances: replicas
      section: replication
      field: master_link_status
      predicate: {equals: up}
      timeout_s: 60

  - use: valkey.oracle.ledger
    id: data
    config: {converge_timeout_s: 60}

  - use: valkey.oracle.deployment-state
    id: deployment-state
    config: {stabilization_wait_s: 1}
required_events: [run-then-disconnect.completed]
required_evidence:
  - {evidence_id: valkey.fault.injected, source: drop-replica-links}
