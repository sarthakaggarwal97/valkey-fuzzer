# valkey.base plus a forced full sync of every replica: after
# `run-before-sync` (writes for `run_before_sync_s`), the primaries change
# their replication ID (DEBUG CHANGE-REPL-ID, which the `full-sync` startup
# overlay enables), so every replica's PSYNC is refused, and drop their
# replica links; `links-up` waits until every link is up again. Needs
# replicas; experiments name what `run-before-sync` follows in its depends_on.
extends: [valkey.base]
inputs:
  properties:
    run_before_sync_s: {type: number, minimum: 0, maximum: 600, default: 1}
startup_overlays:
  - overlay_id: full-sync
    server_config:
      repl-diskless-sync-delay: 0
      enable-debug-command: "yes"
components:
  - use: valkey.action.sleep
    id: run-before-sync
    config: {seconds: {$ref: inputs.run_before_sync_s}}

  # A new replication ID refuses every replica's PSYNC: the next sync is full.
  - use: valkey.action.command
    id: change-replid
    depends_on: [run-before-sync]
    config: {instances: primaries, command: [DEBUG, CHANGE-REPL-ID], expect: {equals: OK}}

  - use: valkey.action.command
    id: drop-replica-links
    depends_on: [change-replid]
    config: {instances: primaries, command: [CLIENT, KILL, TYPE, replica]}

  - use: valkey.action.poll
    id: links-up
    depends_on: [drop-replica-links]
    config:
      instances: replicas
      section: replication
      field: master_link_status
      predicate: {equals: up}
      timeout_s: 120

  - use: valkey.oracle.ledger
    id: data
    config: {converge_timeout_s: 120}
required_events: [drop-replica-links.completed]
