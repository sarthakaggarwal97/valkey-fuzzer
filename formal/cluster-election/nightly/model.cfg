\* model.cfg with a third epoch: a re-election after the two the PR check
\* explores, with two crashes. 33.7 million distinct states (699 million
\* generated), 17 minutes on four workers of a 2026 host, so the nightly job
\* checks it (`spec check cluster-election --configs nightly`), not every PR.
CONSTANTS
    Primaries = {p1, p2, p3}
    Candidates = {r1, r2}
    MaxEpoch = 3
    MaxCrashes = 2
    Quorum = 2
    PersistBeforeAck = TRUE
    FlushBeforeSave = FALSE

SPECIFICATION Spec
INVARIANTS TypeOK OneWinnerPerEpoch VoteOncePerEpoch VotesSavedBeforeSent NoVoteLostInCrash
