\* nodes.conf saved before the vote leaves: cluster-config-save-behavior sync,
\* and no vote written before that save (FlushBeforeSave = FALSE).
\* Two crashes: a bug that needs the second crash of one primary, or a crash
\* of each of two, is where this bound matters. Epochs stay at 2: MaxEpoch 3
\* is nightly/model.cfg (22.5 million states with one crash, 11 minutes on four
\* workers), past what PR CI checks in time. Quorum is a majority of the three
\* primaries, as Valkey's needed_quorum is of the slot-owning primaries.
CONSTANTS
    Primaries = {p1, p2, p3}
    Candidates = {r1, r2}
    MaxEpoch = 2
    MaxCrashes = 2
    Quorum = 2
    PersistBeforeAck = TRUE
    FlushBeforeSave = FALSE

SPECIFICATION Spec
INVARIANTS TypeOK OneWinnerPerEpoch VoteOncePerEpoch VotesSavedBeforeSent NoVoteLostInCrash
