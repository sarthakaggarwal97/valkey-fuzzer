\* Dual-channel replication, with the fix of fuzzer issue #133 (AdoptOnLoad): a
\* replica whose load ends before +CONTINUE adopts the snapshot's ID and offset.
\* Must find no error; negative-controls/keep_old_id_on_load.cfg is Valkey as it is.
CONSTANTS
    Nodes = {n1, n2, n3}
    MaxWrites = 2
    MaxIds = 5
    MaxCrashes = 1
    MaxSwitches = 2
    DualChannel = TRUE
    AdoptOnLoad = TRUE

SPECIFICATION Spec
INVARIANTS TypeOK OneHistoryPerId ReplicaIsPrefix
