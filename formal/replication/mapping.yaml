# Implementation evidence for model.tla: the log lines that show the model's
# replication steps, the faults that crash a node, and the samples that show
# each node's replication IDs, offsets and data set. The replication
# experiments publish the lines and record the samples with the
# valkey.replication-steps fragment (valkey.observer.log-trigger and
# valkey.observer.trace, spec: replication). `spec conform` checks
# SameOffsetSameData on the sampled states; the two claims about data sets as
# sequences stay model only (claims.yaml).
sample:
  # valkey.observer.trace (spec: replication) reads INFO replication and DEBUG
  # DIGEST from every node in each round, in one MULTI/EXEC, so a sample's
  # offset and digest are of one instant. Rounds follow the replication steps
  # and the crashes, and the observer's interval_s sets the period: DEBUG
  # DIGEST walks the data set (about 3 us a key, during which the node serves
  # nothing), so the valkey.replication-steps fragment samples once a second.
  info: [replication]
  digest: true
  on: ['replication.*', '*.injected', '*.instance-killed']
evidence:
  partial:
    event: replication.partial.continued
    log: 'Successful partial resynchronization with primary\.'
    fields: {instance_id: node}
    action: PartialSync
    updates:
      - {set: link, key: $instance_id@Nodes, value: up}
  full:
    # Logged when +FULLRESYNC arrives; the model's FullSync runs from the
    # fork to the end of the load in one step.
    event: replication.full.started
    log: 'Full resync from primary: (?P<replid>[0-9a-f]{40}):(?P<offset>-?\d+)'
    fields: {instance_id: node, replid: str, offset: int}
    action: FullSync
    updates:
      - {set: link, key: $instance_id@Nodes, value: up}
  dual:
    event: replication.dual.started
    log: 'Dual channel replication: PSYNC is not possible, initialize RDB channel\.'
    fields: {instance_id: node}
    action: DualFork
    updates:
      - {set: link, key: $instance_id@Nodes, value: rdb}
  load-failed:
    event: replication.load.failed
    log: 'PRIMARY <-> REPLICA sync: Discarding the half-loaded data'
    fields: {instance_id: node}
    action: LoadFails
    updates:
      - {set: link, key: $instance_id@Nodes, value: down}
  lost:
    event: replication.link.lost
    log: 'Connection with primary lost\.'
    fields: {instance_id: node}
    action: Disconnect
    updates:
      - {set: link, key: $instance_id@Nodes, value: down}
  promoted:
    # shiftReplicationId, from replicationUnsetPrimary: REPLICAOF NO ONE, a
    # FAILOVER, or a cluster failover.
    event: replication.promoted
    log: 'Setting secondary replication ID to (?P<old>[0-9a-f]{40}), valid up to offset: (?P<offset>-?\d+)\. New replication ID is (?P<new>[0-9a-f]{40})'
    fields: {instance_id: node, old: str, offset: int, new: str}
    action: Promote
    updates:
      - {set: role, key: $instance_id@Nodes, value: primary}
      - {set: link, key: $instance_id@Nodes, value: none}
      - {incr: switches}
  replicaof:
    # REPLICAOF host port; a cluster node that follows a new primary does not
    # log this line.
    event: replication.replicaof
    log: 'REPLICAOF (?P<host>\S+):(?P<port>\d+) enabled'
    fields: {instance_id: node, host: str, port: int}
    action: Follow
    updates:
      - {set: role, key: $instance_id@Nodes, value: replica}
      - {set: link, key: $instance_id@Nodes, value: down}
      - {incr: switches}
  backlog-freed:
    event: replication.backlog.freed
    log: 'Replication backlog freed after \d+ seconds without connected replicas'
    fields: {instance_id: node}
    action: FreeBacklog
  saved:
    event: replication.rdb.saved
    log: 'DB saved on disk|Background saving terminated with success'
    fields: {instance_id: node}
    action: Save
    # A BGSAVE's child logs "DB saved on disk" and the server then logs "Background saving terminated with
    # success": one save, two lines in one log. The child's line (role C) is skipped, so a BGSAVE is one Save, as
    # a foreground save (the server's own "DB saved on disk") is.
    logged_by: server
  crash:
    # valkey.fault.process-signal; the node restarts from its RDB file.
    event: '*.injected'
    where: {signal: SIGKILL, applied: true}
    fields: {target: node}
    action: Crash
    updates:
      - {incr: crashes}
  chaos-kill:
    # A kill operation of valkey.action.replication-chaos, which a restart
    # operation or the heal follows. A SIGTERM's shutdown save is logged
    # first, as a Save.
    event: '*.instance-killed'
    where: {success: true}
    fields: {instance_id: node}
    action: Crash
    updates:
      - {incr: crashes}
  # A sample of one node: its role, replication IDs, offsets and backlog from
  # INFO replication, and a DEBUG DIGEST of its data set, which stands for the
  # model's data (equal digests, equal data sets). Valkey writes forty zeros
  # for no secondary ID and -1 for no second offset, where the model has 0.
  # The link stays with the log lines: INFO's up and down are coarser than the
  # model's dual-channel states, and a sample's "down" during a sync is no
  # disagreement with them.
  sample-primary:
    sample: true
    where: {info.role: master}
    fields:
      node: node
      offset: {type: int, path: info.master_repl_offset}
      replid: {type: str, path: info.master_replid}
      replid2: {type: str, path: info.master_replid2, map: {"0000000000000000000000000000000000000000": 0}}
      second_offset: {type: int, path: info.second_repl_offset, map: {-1: 0}}
      backlog: {type: int, path: info.repl_backlog_first_byte_offset}
      digest: str
    updates:
      - {set: role, key: $node@Nodes, value: primary}
      - {set: off, key: $node@Nodes, value: $offset}
      - {set: replid, key: $node@Nodes, value: $replid}
      - {set: replid2, key: $node@Nodes, value: $replid2}
      - {set: secondOff, key: $node@Nodes, value: $second_offset}
      - {set: backlog, key: $node@Nodes, value: $backlog}
      - {set: data, key: $node@Nodes, value: $digest}
  sample-replica:
    # A replica is sampled while it streams (master_link_status up), when the
    # model has it claim its ID. In a full sync, or loading its RDB file after
    # a restart, it reports its old ID and offset over a data set being
    # replaced; its last streaming sample stands until the next.
    sample: true
    where: {info.role: slave, info.master_link_status: up}
    fields:
      node: node
      offset: {type: int, path: info.master_repl_offset}
      replid: {type: str, path: info.master_replid}
      replid2: {type: str, path: info.master_replid2, map: {"0000000000000000000000000000000000000000": 0}}
      second_offset: {type: int, path: info.second_repl_offset, map: {-1: 0}}
      backlog: {type: int, path: info.repl_backlog_first_byte_offset}
      digest: str
    updates:
      - {set: role, key: $node@Nodes, value: replica}
      - {set: off, key: $node@Nodes, value: $offset}
      - {set: replid, key: $node@Nodes, value: $replid}
      - {set: replid2, key: $node@Nodes, value: $replid2}
      - {set: secondOff, key: $node@Nodes, value: $second_offset}
      - {set: backlog, key: $node@Nodes, value: $backlog}
      - {set: data, key: $node@Nodes, value: $digest}

unobservable:
  Write: Client writes are not logged; the samples' offsets and digests show their effect.
  Stream: Applying the stream is not logged; the samples' offsets and digests show its effect.
  Trim: Trimming the backlog is not logged; the samples' repl_backlog_first_byte_offset shows its effect.
  DualContinueEarly: >-
    Valkey logs +CONTINUE on the main channel ("Primary accepted a Partial
    Resynchronization") and the end of the load ("Done loading RDB"); which
    of the four dual-channel steps a line shows depends on which came first,
    and the mapping maps one line to one action.
  DualLoadContinued: As DualContinueEarly.
  DualLoadFirst: As DualContinueEarly.
  DualContinueLate: As DualContinueEarly.
  Idle: A step in which nothing happens.

processes:
  Nodes:
    prefix: node
    members:
      - {evidence: sample-primary, field: node}
      - {evidence: sample-replica, field: node}
      - {evidence: partial, field: instance_id}
      - {evidence: full, field: instance_id}
      - {evidence: dual, field: instance_id}
      - {evidence: promoted, field: instance_id}
      - {evidence: replicaof, field: instance_id}
      - {evidence: lost, field: instance_id}
      - {evidence: crash, field: target}
      - {evidence: chaos-kill, field: instance_id}

state:
  role: {over: [Nodes], init: unknown}
  link: {over: [Nodes], init: unknown}
  switches: {init: 0}
  crashes: {init: 0}
  # From the samples. Valkey's IDs are random hex where the model numbers
  # them, and a digest stands for the data set; both are compared for
  # equality only. A node never sampled keeps these, so it claims nothing.
  off: {over: [Nodes], init: 0}
  replid: {over: [Nodes], init: ""}
  replid2: {over: [Nodes], init: 0}
  secondOff: {over: [Nodes], init: 0}
  backlog: {over: [Nodes], init: 0}
  data: {over: [Nodes], init: ""}
  primaryOf: {hidden: '[n \in Nodes |-> n]', why: "INFO names the primary by host and port, not by instance; nothing conformed reads it."}
  cached: {hidden: '[n \in Nodes |-> FALSE]', why: "A cached primary is not in INFO or the logs; a replica with its link down claims nothing, which checks less, never wrongly."}
  rdb: {hidden: '[n \in Nodes |-> [data |-> <<>>, id |-> 0, off |-> 0]]', why: "An RDB file's contents are not observed."}
  snap: {hidden: '[n \in Nodes |-> [data |-> <<>>, id |-> 0, off |-> 0]]', why: "A snapshot's contents are not observed."}
  nextId: {hidden: '0', why: "The model numbers replication IDs; Valkey's are random hex."}
  writes: {hidden: '0', why: "Client writes are not counted; the offsets stand for them."}

constants:
  MaxWrites: {value: 2, why: "No conformed property reads it; the model's bound."}
  MaxIds: {value: 5, why: "As MaxWrites."}
  MaxCrashes: {max_of: [crashes], at_least: 1}
  MaxSwitches: {max_of: [switches], at_least: 1}
  # The claims hold over one channel. The trace header records each node's
  # dual-channel-replication-enabled (valkey.observer.trace config_keys), so a
  # dual-channel run is outside the claim: a violation there (fuzzer issue
  # #133) is reported, not held against the run.
  DualChannel: {config: dual-channel-replication-enabled, equals: "yes"}
  AdoptOnLoad: {value: "FALSE", why: "Valkey as it is (fuzzer issue #133)."}

scenario:
  # No control's counterexample takes Crash: each is a sequence of syncs,
  # promotions and REPLICAOFs after which two claims on one replication ID
  # name two data sets. The one fault a counterexample takes, the link drop
  # of keep_old_id_on_load, is what valkey.replication-full-resync injects
  # (stall-replica, a SIGSTOP the primary answers by closing the link), on its
  # own timer rather than on a mapped line, so the scenario injects no fault:
  # it sets the deployment of the model's three nodes (one primary, Nodes - 1
  # replicas; the deployment counts replicas, so the count is written here)
  # and the variants sweep the stall. DualChannel and AdoptOnLoad set no
  # input: the experiments take dual-channel-replication-enabled from the
  # deployment's server_config, and AdoptOnLoad is Valkey's code.
  experiment: valkey.replication-full-resync
  deployment:
    mode: standalone
    replicas_per_primary: 2
    base_port: 7730
  unmapped:
    Crash: >-
      No control's counterexample takes Crash, and no replication experiment
      kills a node with a fault component: valkey.replication-chaos kills
      through its action's waves, which its schedule sets, not a log line.
    Disconnect: >-
      valkey.replication-full-resync drops the link with stall-replica
      (SIGSTOP), fired by its own timer (run-then-stall.completed), not by a
      mapped line; the trace's Disconnect follows the unobservable
      DualLoadContinued.
    LoadFails: No fault component fails a load.
  variants:
    inputs:
      pause_s: [3, 5]
