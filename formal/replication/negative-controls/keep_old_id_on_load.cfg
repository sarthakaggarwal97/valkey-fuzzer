\* Valkey as it is (fuzzer issue #133): a dual-channel replica whose load ends
\* before +CONTINUE keeps its old ID and offset, and may be promoted then.
CONSTANTS
    Nodes = {n1, n2, n3}
    MaxWrites = 2
    MaxIds = 5
    MaxCrashes = 1
    MaxSwitches = 2
    DualChannel = TRUE
    AdoptOnLoad = FALSE

SPECIFICATION Spec
INVARIANT OneHistoryPerId
