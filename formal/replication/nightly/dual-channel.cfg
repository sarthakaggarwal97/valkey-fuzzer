\* dual-channel.cfg with a second crash: 10.2 million distinct states (86.9
\* million generated), 3 minutes on four workers of a 2026 host and past five
\* on a CI runner, so the nightly job checks it
\* (`spec check replication --configs nightly`), not every PR.
CONSTANTS
    Nodes = {n1, n2, n3}
    MaxWrites = 2
    MaxIds = 5
    MaxCrashes = 2
    MaxSwitches = 2
    DualChannel = TRUE
    AdoptOnLoad = TRUE

SPECIFICATION Spec
INVARIANTS TypeOK OneHistoryPerId ReplicaIsPrefix SameOffsetSameData
