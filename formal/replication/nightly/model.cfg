\* model.cfg with a second crash: a bug that needs a node to crash twice, or
\* two nodes to crash, is where this bound matters. 743,973 distinct states,
\* 16 s on four workers; nightly only because the claims' bounds hold for
\* every safe config and dual-channel.cfg cannot afford the second crash in a
\* PR check (`spec check replication --configs nightly`).
CONSTANTS
    Nodes = {n1, n2, n3}
    MaxWrites = 2
    MaxIds = 5
    MaxCrashes = 2
    MaxSwitches = 2
    DualChannel = FALSE
    AdoptOnLoad = FALSE

SPECIFICATION Spec
INVARIANTS TypeOK OneHistoryPerId ReplicaIsPrefix SameOffsetSameData
