\* Single-channel replication (dual-channel-replication-enabled no, the default),
\* Valkey as it is: must find no error. AdoptOnLoad is never read without dual
\* channel; FALSE is what Valkey does, and the claims' holds_when.
CONSTANTS
    Nodes = {n1, n2, n3}
    MaxWrites = 2
    MaxIds = 5
    MaxCrashes = 1
    MaxSwitches = 2
    DualChannel = FALSE
    AdoptOnLoad = FALSE

SPECIFICATION Spec
INVARIANTS TypeOK OneHistoryPerId ReplicaIsPrefix
