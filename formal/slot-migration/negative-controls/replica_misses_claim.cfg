\* Valkey as it is: the target's replica learns the target's claim only on the bus, so
\* promoted after the target crashed without that message reaching it, it deletes the
\* slot it imported. Reproduced on unstable d5763ea44: sarthakaggarwal97/valkey-fuzzer#140
\* (valkey-io/valkey#2724 reports the ownership half). The election can save R only
\* when its vote request claims another slot of T whose epoch the claim raised (the
\* voters then send it an UPDATE); T here owns no other slot, so R always wins.
CONSTANTS
    MaxWrites = 2
    MaxFaults = 2
    CancelKeepsPause = TRUE
    ExpiryAfterClaim = FALSE
    ClaimReachesReplica = FALSE

SPECIFICATION Spec
INVARIANT NoAckedWriteLost
