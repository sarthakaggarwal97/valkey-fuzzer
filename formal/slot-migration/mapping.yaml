# Implementation evidence for model.tla: the log lines that show the steps of
# an atomic slot migration (CLUSTER MIGRATESLOTS), and the samples that show
# the jobs' states. The valkey.slot-migration-spec experiment publishes the
# lines with valkey.observer.log-trigger and records the samples with
# valkey.observer.trace (both spec: slot-migration), and `spec translate`
# writes its scenarios from the `scenario` section below. The claims need
# each node's view of the slot's owner and the writes it holds, which a run
# does not observe in the model's terms, so `spec conform` checks no property
# of this bundle: it reports which steps real runs took, and the job states
# the samples showed.
sample:
  # valkey.observer.trace (spec: slot-migration) reads CLUSTER INFO and
  # CLUSTER NODES (the view) and CLUSTER GETSLOTMIGRATIONS from every node in
  # each round.
  cluster: true
  slot_migrations: true
  on: ['slot-migration.*', '*.injected']
evidence:
  started:
    # On the source.
    event: slot-migration.started
    log: 'Slot migration initiated through CLUSTER MIGRATESLOTS command'
    fields: {instance_id: node}
    action: Start
  established:
    # On the target; its replica's tracking job names no source.
    event: slot-migration.import.created
    log: 'New slot import job created: \{name: [0-9a-f]{40}, operation: import, source_node_id: [0-9a-f]{40}'
    fields: {instance_id: node}
    action: TEstablish
  tracking:
    event: slot-migration.tracking.created
    log: 'New slot import job created: \{name: [0-9a-f]{40}, operation: import, source_node_id: unknown'
    fields: {instance_id: node}
    action: RApply
  forked:
    event: slot-migration.snapshot.started
    log: 'Beginning snapshot of slot migration'
    fields: {instance_id: node}
    action: SFork
  snapshot:
    event: slot-migration.snapshot.received
    log: 'successfully received slot snapshot\. Beginning incremental stream'
    fields: {instance_id: node}
    action: TApply
  paused:
    event: slot-migration.paused
    log: 'Pausing writes \(remaining_repl_size is -?\d+\) to allow slot migration'
    fields: {instance_id: node}
    action: SPause
  requested:
    event: slot-migration.failover.requested
    log: 'operation: import, .*state transition: waiting-for-paused -> failover-requested'
    fields: {instance_id: node}
    action: TPaused
  granted:
    event: slot-migration.failover.granted
    log: 'operation: export, .*state transition: failover-paused -> failover-granted'
    fields: {instance_id: node}
    action: SGrant
  claimed:
    event: slot-migration.claimed
    log: 'completed successfully\. This node is now the owner of the slots'
    fields: {instance_id: node}
    action: TClaim
  learned:
    # The source reads the target's claim on the bus.
    event: slot-migration.owner.learned
    log: 'slots are now owned by target node\.'
    fields: {instance_id: node}
    action: Deliver
  cleanup:
    event: slot-migration.import.cleanup
    log: 'Cleaning up slot migration .* after '
    fields: {instance_id: node}
    action: TCleanup
  cancelled:
    event: slot-migration.cancelled
    log: 'Canceled all in progress slot migrations'
    fields: {instance_id: node}
    action: Cancel
    updates:
      - {incr: faults}
  pause-ended:
    event: slot-migration.pause.ended
    log: 'timed out during slot failover|Write loss risk!'
    fields: {instance_id: node}
    action: PauseExpires
    updates:
      - {incr: faults}
  link-lost:
    # The source's side; a cancel closes the connection without this line.
    event: slot-migration.link.lost
    log: 'operation: export, .* connection lost'
    fields: {instance_id: node}
    action: DropLink
    updates:
      - {incr: faults}
  promoted:
    event: slot-migration.replica.promoted
    log: 'Setting myself to primary in shard'
    fields: {instance_id: node}
    action: Promote
  crash:
    # valkey.fault.process-signal on the target.
    event: '*.injected'
    where: {signal: SIGKILL, applied: true}
    fields: {target: node}
    action: CrashT
    updates:
      - {incr: faults}
  # The jobs of CLUSTER GETSLOTMIGRATIONS, by kind (an export, an import with a
  # source, or a replica's tracking job) in creation order: the model has one
  # slot and one attempt, so a node's first job of a kind is its job, and only
  # S exports, only T imports, and only R tracks, so the sample names the job
  # without knowing which run node plays which part. Valkey's states map onto
  # the model's: the export is `establish` until S reads +OK and forks (SFork),
  # `stream` from the fork until S pauses, and the import is `requested` until
  # T claims the slot on the grant (TClaim). A terminal state (success, failed,
  # cancelled) is Valkey's word as the model has it.
  export-job:
    sample: true
    where: {slot_migrations.export.0.operation: EXPORT}
    fields:
      state:
        type: str
        path: slot_migrations.export.0.state
        map:
          connecting: establish
          sending-auth-command: establish
          reading-auth-response: establish
          sending-establish-command: establish
          reading-establish-response: establish
          waiting-to-snapshot: establish
          snapshotting: stream
          replicating: stream
          waiting-to-pause: stream
          failover-paused: paused
          failover-granted: granted
    updates:
      - {set: exp, value: $state}
  import-job:
    sample: true
    where: {slot_migrations.import.0.operation: IMPORT}
    fields:
      state:
        type: str
        path: slot_migrations.import.0.state
        map:
          waiting-for-ack: receive
          receiving-snapshot: receive
          waiting-for-paused: waitPaused
          failover-requested: requested
          failover-granted: requested
          cleaning-up: cleanup
          cancelled: failed
    updates:
      - {set: imp, value: $state}
  tracking-job:
    sample: true
    where: {slot_migrations.tracking.0.operation: IMPORT}
    fields:
      state:
        type: str
        path: slot_migrations.tracking.0.state
        map: {occurring-on-primary: tracking, cancelled: failed}
    updates:
      - {set: track, value: $state}

unobservable:
  Write: Client writes are not logged.
  TClose: >-
    The target logs the close of a connection only while its import is in
    progress, as the cleanup that follows (TCleanup) shows.
  LoseBus: A bus message that never arrives leaves no line.
  Idle: A step in which nothing happens.

state:
  faults: {init: 0}
  # From the CLUSTER GETSLOTMIGRATIONS samples.
  exp: {init: none}
  imp: {init: none}
  track: {init: none}
  role: {hidden: '[n \in {"S", "T", "R"} |-> "primary"]', why: "The model names its nodes S, T and R; which run node plays which part is in the samples' jobs, but the variables are not keyed by run node."}
  view: {hidden: '[n \in {"S", "T", "R"} |-> [owner |-> "S", epoch |-> 1]]', why: "As role: the samples carry each node's slot owners, but the model keys the view by S, T and R."}
  epoch: {hidden: '1', why: "As view."}
  data: {hidden: '[n \in {"S", "T", "R"} |-> <<>>]', why: "A run does not observe which writes a node holds."}
  hidden: {hidden: '[n \in {"S", "T", "R"} |-> FALSE]', why: "Importing slots are not logged per key."}
  toT: {hidden: '<<>>', why: "Messages in flight are not observed."}
  toS: {hidden: '<<>>', why: "As toT."}
  repl: {hidden: '<<>>', why: "As toT."}
  bus: {hidden: '{}', why: "As toT."}
  paused: {hidden: 'FALSE', why: "The pause is in INFO samples (paused_reason), which these lines do not carry."}
  acked: {hidden: '{}', why: "As data."}
  writes: {hidden: '0', why: "As data."}

constants:
  MaxWrites: {value: 3, why: "No property is checked on observed states; the model's bound."}
  MaxFaults: {max_of: [faults], at_least: 3}
  # Every property claims these three, which are fixes Valkey does not have
  # (claims.yaml, assumptions), so a run is checked as claimed, as
  # cluster-election pins FlushBeforeSave: once a property is conformed, a run
  # in which Valkey as it is lets two nodes write, or loses an acknowledged
  # write, violates the claim and fails, as it should. Pinned to Valkey as it
  # is, no run could ever meet holds_when and no violation would count.
  CancelKeepsPause: {value: "TRUE", why: "The claims' condition; whether a cancel unpauses is not in the mapped lines."}
  ExpiryAfterClaim: {value: "FALSE", why: "The claims' condition; the pause's end and the claim are on different nodes."}
  ClaimReachesReplica: {value: "TRUE", why: "The claims' condition; how the replica learned the claim is not logged."}

scenario:
  experiment: valkey.slot-migration-spec
  # S, T and R are fixed: shard 0's primary owns the slot of {s}, shard 1's
  # primary imports it, and shard 1's replica is R; the third primary gives R
  # the second vote its election needs. MaxWrites and MaxFaults set no input,
  # and the three fix constants are Valkey's code.
  deployment:
    mode: cluster
    primaries: 3
    replicas_per_primary: 1
    base_port: 7760
  faults:
    # kill-target (valkey.fault.process-signal) kills the node whose
    # "completed successfully. This node is now the owner of the slots" line
    # appears, kill_delay_s after it: the target, at its claim. The one
    # migration gives one such line, so no occurrence input is needed; the
    # steps between the claim and the crash (a write to T, R applying T's
    # stream) must fit in kill_delay_s, which the variants sweep.
    - action: CrashT
      after: claimed
      component: kill-target
  unmapped:
    Cancel: >-
      No fault component sends CLUSTER CANCELSLOTMIGRATIONS on a log line;
      valkey.action.command is an action, scheduled by depends_on, not a
      fault a mapped line triggers.
    DropLink: >-
      No fault component closes the migration connection alone;
      valkey.fault.network-partition cuts the cluster bus with it, and needs
      root and iptables.
    PauseExpires: >-
      The pause ends at cluster-manual-failover-timeout on its own; no
      component holds the target so that it does (DEBUG SLOTMIGRATION
      PREVENT-FAILOVER is a command).
    LoseBus: >-
      The model loses a bus message after its sender died, where no fault can
      act; a partition of the target from its replica before the claim
      (valkey.fault.network-partition, root and iptables) would stand for it.
  variants:
    inputs:
      kill_delay_s: [0, 0.2, 1]
