\* Atomic slot migration with the three fixes: a cancel after the grant keeps the
\* source paused, the source's pause outlasts the target's claim, and the
\* target's replica learns the claim first. Must find no error.
CONSTANTS
    MaxWrites = 3
    MaxFaults = 3
    CancelKeepsPause = TRUE
    ExpiryAfterClaim = FALSE
    ClaimReachesReplica = TRUE

SPECIFICATION Spec
INVARIANTS TypeOK OneWriter NoAckedWriteLost
