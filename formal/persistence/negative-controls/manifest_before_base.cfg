\* The manifest naming the new base is written before the base is renamed into place,
\* so a kill between them leaves a manifest that names a missing file.
CONSTANTS
    MaxWrites = 2
    MaxFiles = 7
    MaxCrashes = 1
    MaxSwitches = 2
    MaxRewrites = 2

SPECIFICATION MutantSpec
INVARIANT ManifestFilesExist
