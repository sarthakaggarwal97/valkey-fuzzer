\* incremental file.
CONSTANTS
    MaxWrites = 2
    MaxFiles = 7
    MaxCrashes = 1
    MaxSwitches = 2
    MaxRewrites = 2

SPECIFICATION MutantSpec
INVARIANT AofIsPrefix
