\* When the rewrite is done, the incremental file the server appends to becomes history
\* too (markRewrittenIncrAofAsHistory keeps it), so the manifest names only the base
\* and the writes after the fork are not loaded.
CONSTANTS
    MaxWrites = 2
    MaxFiles = 7
    MaxCrashes = 1
    MaxSwitches = 2
    MaxRewrites = 2

SPECIFICATION MutantSpec
INVARIANT AckedRestored
