# Run a cluster whose nodes use different valkey-server builds (assigned with
# topology.valkey_binary and topology.node_binaries), drive writes, and fail over
# a shard so a node of one build promotes while peers run another.  Requires
# at least two distinct builds; otherwise the scenario is SKIP_UNSUPPORTED.
pack_id: valkey.mixed-version-cluster
version: "1"
supported_topologies: [cluster]
metadata:
  description: Mixed-build cluster with workload and failover; verifies each node runs its assigned binary
input_schema:
  type: object
  additionalProperties: false
  properties:
    stable_keys: {type: integer, minimum: 0, maximum: 1000000, default: 1000}
    mutable_keys: {type: integer, minimum: 1, maximum: 100000, default: 200}
    mutation_rate: {type: number, minimum: 0, maximum: 20000, default: 200}
    failover_shard: {type: integer, minimum: 0, maximum: 15, default: 0}
    force_failover: {type: boolean, default: false}
components:
  - kind: capability
    component_id: valkey.build_probe
    instance_id: builds
    config:
      min_distinct_builds: 2

  - kind: workload
    component_id: valkey.kv_workload
    instance_id: writes
    config:
      stable_keys: {$ref: inputs.stable_keys}
      mutable_keys: {$ref: inputs.mutable_keys}
      rate: {$ref: inputs.mutation_rate}

  - kind: action
    component_id: valkey.failover
    instance_id: failover
    depends_on: [writes]
    config:
      shard: {$ref: inputs.failover_shard}
      force: {$ref: inputs.force_failover}

  - kind: oracle
    component_id: valkey.binary_check
    instance_id: provenance
    config: {min_distinct_versions: 2}

  - kind: oracle
    component_id: valkey.topology_state
    instance_id: topology
    config: {stabilization_wait_s: 2, timeout_s: 120}

  - kind: oracle
    component_id: valkey.ledger
    instance_id: data
    config: {workload: writes, converge_timeout_s: 60}

  - kind: oracle
    component_id: valkey.liveness
    instance_id: liveness
required_events: [failover.completed]
required_evidence:
  - {evidence_id: valkey.capability.supported, source: builds}
  - {evidence_id: valkey.failover.result, source: failover}
  - {evidence_id: valkey.binary.verified, source: provenance}
  - {evidence_id: valkey.topology.validated, source: topology}
  - {evidence_id: valkey.data.ledger_verified, source: data}
